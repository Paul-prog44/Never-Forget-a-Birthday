<h2 mat-dialog-title>Modifier les informations</h2>
    
    <mat-dialog-content>
      <form [formGroup]="editForm" id="editFriendForm" class="edit-form">
        <mat-form-field appearance="outline">
          <mat-label>Prénom</mat-label>
          <input matInput formControlName="firstname">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Nom</mat-label>
          <input matInput formControlName="lastname">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Adresse email</mat-label>
          <input matInput formControlName="email" type="email">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Date de naissance</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="date_of_birth">
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </form>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-stroked-button (click)="onCancel()">Annuler</button>
      <button 
        mat-raised-button 
        color="primary" 
        [disabled]="editForm.invalid" 
        (click)="onSave()">
        Enregistrer
      </button>
    </mat-dialog-actions>
